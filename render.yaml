projects:
  - name: hellen-charafoulina
    environments:
      - name: production
        services:
          - type: web
            name: hellen-charafoulina
            runtime: node
            plan: free
            buildCommand: npm install && npm run build
            startCommand: npm run start --workspace=@sharapulina/api
            healthCheckPath: /api/health
            envVars:
              - key: SUPABASE_URL
                sync: false
              - key: SUPABASE_PUBLISHABLE_KEY
                sync: false
              - key: SUPABASE_SECRET_KEY
                sync: false
              - key: WEB_ORIGIN
                value: ""
              - key: VITE_SUPABASE_URL
                sync: false
              - key: VITE_SUPABASE_PUBLISHABLE_KEY
                sync: false
